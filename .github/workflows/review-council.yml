name: Review Council

# Reusable workflow: run a Review Council review of a pull request, unattended,
# and post (or update) the single review-digest comment on it.
#
# Claude authenticates in one of two ways:
#   - API key (default): pass the ANTHROPIC_API_KEY secret.
#   - Anthropic Workload Identity Federation (opt-in, no stored key): set
#     anthropic_federation_rule_id (plus the organization and service account
#     IDs) and grant `id-token: write` in the caller. The job mints GitHub OIDC
#     tokens and Claude Code trades them for short-lived Anthropic tokens.
# The mode is federation when anthropic_federation_rule_id is set, else
# api_key. A mixed or incomplete setup fails early in run-review.sh.
#
# Call it from a workflow in your repo that triggers on `pull_request` and/or
# `issue_comment` (see examples/github-action/review-council.yml and
# docs/github-action.md). The caller must grant:
#   contents: read, pull-requests: write, issues: write
#   + id-token: write  (federation only; API-key callers must NOT grant it)
#
# Permissions: the `review` job declares no `permissions:` and this file has
# no workflow-level grant, so the review job runs with exactly what the caller
# grants. Callers must therefore grant the minimum above and nothing more.
# (A job that declared `id-token: write` here would force every caller to
# grant it, even API-key callers, since GitHub validates skipped jobs too.)
# The `gate` job keeps its own narrow grant.
#
# Security model, in short:
#   - Fork PRs are skipped (secrets would be exposed to untrusted code paths).
#   - `/review-council` comments only run for users with write, maintain or
#     admin permission on the repo.
#   - Every event-derived value (comment body, login, branch name) reaches a
#     script through `env:`, never through `${{ }}` inside `run:`.
#   - Every check (event, fork, draft, open, commenter permission) runs in the
#     `gate` job, which holds no concurrency group. Only the `review` job, which
#     runs after the gate passes, takes the per-PR group with cancel-in-progress
#     — so a comment from a user without write access cannot cancel a review.
#   - The reviewed repo is checked out without persisted credentials; the
#     token used to post is GITHUB_TOKEN, scoped by the caller's grant.
#   - In federation mode run-review.sh unsets the OIDC request variables
#     before starting Claude, so they are not in Claude's environment. This
#     is a partial guard only: a process with Bash on the runner can still
#     read them (e.g. from /proc, or via sudo on hosted runners).
#   - The composite actions are loaded from deployhq/review-council at
#     `plugin_ref`, the same ref as the plugin itself.
on:
  workflow_call:
    inputs:
      approved_seats:
        description: Comma-separated custom-seat slot names pre-approved for CI (RC_APPROVED_SEATS). Seats from committed config that would otherwise need a confirmation are skipped unless listed here.
        type: string
        default: ''
      run_budget_seconds:
        description: Review Council run budget in seconds (RC_RUN_BUDGET). Also sizes the review timeout.
        type: number
        default: 900
      plugin_ref:
        description: Git ref of deployhq/review-council to run (the plugin and the shared composite actions).
        type: string
        default: main
      claude_code_version:
        description: Version of @anthropic-ai/claude-code to install.
        type: string
        default: 2.1.312
      codex_version:
        description: Version of @openai/codex to install (only when OPENAI_API_KEY is set, or a custom seat uses the codex harness).
        type: string
        default: 0.163.0
      static_analysis:
        description: Run the static-analysis step (Step 2.5) and install its tools (RC_STATIC_ANALYSIS).
        type: boolean
        default: true
      skip_bot_prs:
        description: Skip PRs opened by a bot account (Dependabot, Renovate, a GitHub App). Their text can come from outside your org. Off by default, so agent-opened PRs are reviewed.
        type: boolean
        default: false
      pr_bot_login:
        description: With PR_BOT_TOKEN, the login it posts as (e.g. "my-app[bot]"). An App token can't read its own login, and without it the run never resolves threads or dismisses reviews, since it can't tell its own from another bot's.
        type: string
        default: ''
      # Workload Identity Federation (opt-in). These IDs are not secrets.
      # Setting anthropic_federation_rule_id switches Claude auth to federation.
      anthropic_federation_rule_id:
        description: Federation rule ID (fdrl_...). Set it to authenticate Claude with federation instead of ANTHROPIC_API_KEY; the caller must then grant id-token write.
        type: string
        default: ''
      anthropic_organization_id:
        description: Anthropic organization ID (UUID). Required with federation.
        type: string
        default: ''
      anthropic_service_account_id:
        description: Service account ID (svac_...) the federation rule targets. Required with federation.
        type: string
        default: ''
      anthropic_workspace_id:
        description: Optional workspace ID (wrkspc_...); only needed when the federation rule covers more than one workspace.
        type: string
        default: ''
    secrets:
      ANTHROPIC_API_KEY:
        description: Anthropic API key for Claude. Required unless anthropic_federation_rule_id is set.
        required: false
      OPENAI_API_KEY:
        description: Optional. Enables the Codex reviewer (exported to Codex as CODEX_API_KEY).
        required: false
      OPENROUTER_API_KEY:
        description: Optional. Key for custom seats on OpenRouter.
        required: false
      PERPLEXITY_API_KEY:
        description: Optional. Enables the Perplexity reviewer.
        required: false
      PR_BOT_TOKEN:
        description: Optional. A token (e.g. a GitHub App installation token minted in the caller) used to post the digest as that App or bot instead of github-actions[bot].
        required: false

# Deliberately no workflow-level `permissions:`: the review job inherits the
# caller's grant (see the header). The gate job sets its own below.

jobs:
  gate:
    name: Gate
    # Cheap pre-filter; the gate step re-checks against the live PR.
    # Deliberately NO concurrency group here: anyone can trigger this job by
    # commenting, so it must never be able to cancel a review in progress.
    if: >
      (
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/review-council')
      )
    runs-on: ubuntu-latest
    permissions:
      # (metadata: read is implicit and covers the collaborator-permission lookup)
      contents: read        # check out the gate action from deployhq/review-council
      pull-requests: read   # read the live PR
      issues: write         # the eyes reaction on the triggering comment
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      head_ref: ${{ steps.gate.outputs.head_ref }}
      timeout_minutes: ${{ steps.gate.outputs.timeout_minutes }}
    steps:
      - name: Check out the gate action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: deployhq/review-council
          ref: ${{ inputs.plugin_ref }}
          path: rc-plugin
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Resolve PR and check gates
        id: gate
        uses: ./rc-plugin/.github/actions/gate
        with:
          run_budget_seconds: ${{ inputs.run_budget_seconds }}
          skip_bot_prs: ${{ inputs.skip_bot_prs }}

  review:
    name: Review Council
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # Backstop only: run-review.sh enforces the gate's per-run timeout itself
    # (a step inside a composite action can't set timeout-minutes).
    timeout-minutes: 120
    # Deliberately NO `permissions:` key: this job gets exactly the caller's
    # grant (contents: read, pull-requests: write, issues: write, plus
    # id-token: write for federation only). See the header.
    # Taken only after the gate passed, so only an authorised trigger can
    # cancel (supersede) a review in progress for the same PR.
    concurrency:
      group: review-council-${{ github.repository }}-${{ needs.gate.outputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.head_ref }}
          path: repo
          fetch-depth: 0
          persist-credentials: false

      # Kept outside the reviewed tree so static scanners never see it as new files.
      - name: Check out Review Council
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: deployhq/review-council
          ref: ${{ inputs.plugin_ref }}
          path: rc-plugin
          persist-credentials: false

      # Installs, runs the review (timeout enforced inside the action, from the
      # gate's timeout_minutes) and writes the redacted job summary.
      - name: Review Council
        uses: ./rc-plugin/.github/actions/review
        with:
          auth_mode: ${{ inputs.anthropic_federation_rule_id != '' && 'federation' || 'api_key' }}
          pr_number: ${{ needs.gate.outputs.pr_number }}
          timeout_minutes: ${{ needs.gate.outputs.timeout_minutes }}
          approved_seats: ${{ inputs.approved_seats }}
          run_budget_seconds: ${{ inputs.run_budget_seconds }}
          claude_code_version: ${{ inputs.claude_code_version }}
          codex_version: ${{ inputs.codex_version }}
          static_analysis: ${{ inputs.static_analysis }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          perplexity_api_key: ${{ secrets.PERPLEXITY_API_KEY }}
          pr_bot_token: ${{ secrets.PR_BOT_TOKEN }}
          pr_bot_login: ${{ inputs.pr_bot_login }}
          anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
          anthropic_workspace_id: ${{ inputs.anthropic_workspace_id }}
